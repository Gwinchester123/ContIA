spring.application.name=contia
server.port=${PORT:8080}

# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/contia
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

contia.jwt.secret=${CONTIA_JWT_SECRET:contia-secret-local-inseguro-altere-em-producao}
contia.frontend-origin=${CONTIA_FRONTEND_ORIGIN:http://localhost:5173}
