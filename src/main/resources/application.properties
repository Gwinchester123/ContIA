spring.application.name=contia
spring.datasource.url=${NEON_JDBC_URL:jdbc:postgresql://ep-winter-cloud-bdv2vwtb-pooler.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${NEON_DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${NEON_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
contia.jwt.secret=${CONTIA_JWT_SECRET}
contia.frontend-origin=${CONTIA_FRONTEND_ORIGIN:http://localhost:5173}
